<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila Hospitalar · Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Central: as três telas do sistema numa aba só, uma por vez ou lado a lado. */
:root {
  --bg: #eef2f4; --surface: #fff; --ink: #15232b; --muted: #5b6c76; --line: #d5dee3; --soft: #e3edf1;
  --accent: #0b6e8a; --accent-ink: #fff; --r5: #c8102e;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e171c; --surface: #162229; --ink: #e4ecef; --muted: #93a6b0; --line: #2a3a43; --soft: #1d2d35; --accent: #3fb3d3; --accent-ink: #06222b; --r5: #ff5c6f; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 20px; margin-right: 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 7px 12px; font-size: 14.5px; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.tab:hover { background: var(--soft); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tab .badge { font-family: var(--f-mono); font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"] .badge { background: rgb(255 255 255 / .25); color: inherit; }
.tab.ping { animation: ping 1.4s ease-out 2; }
@keyframes ping { from { box-shadow: 0 0 0 0 var(--accent); } to { box-shadow: 0 0 0 10px transparent; } }
body.lado .tab { pointer-events: none; opacity: .55; }

.right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 11px; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-size: 13.5px; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.call { border-color: var(--r5); color: var(--r5); font-weight: 700; animation: call 1.6s ease-in-out infinite; }
@keyframes call { 50% { box-shadow: 0 0 0 4px rgb(200 16 46 / .18); } }
a.lnk { color: var(--muted); font-size: 13.5px; }

.stage { flex: 1; position: relative; min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); visibility: hidden; }
.stage iframe.show { visibility: visible; }
body.lado .stage { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line); }
body.lado .stage iframe { position: static; visibility: visible; }
@media (max-width: 1100px) { body.lado .stage { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; } body.lado #f-painel { grid-column: 1 / -1; } }
body.lado .stage .lbl { display: none; }
@media (prefers-reduced-motion: reduce) { .tab.ping, .btn.call { animation: none; } }
</style>
</head>
<body>

<div class="bar">
  <span class="brand"><svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#0b6e8a"/><path d="M14 8h6v6h6v6h-6v6h-6v-6H8v-6h6z" fill="#fff"/></svg>Fila Hospitalar</span>
  <div class="tabs" role="tablist" aria-label="Telas do sistema">
    <button class="tab" role="tab" data-tela="triagem" id="t-triagem">1 · Triagem <span class="badge" id="b-triagem">0</span></button>
    <button class="tab" role="tab" data-tela="fila" id="t-fila">2 · Fila e chamada <span class="badge" id="b-fila">0</span></button>
    <button class="tab" role="tab" data-tela="painel" id="t-painel">3 · Painel da TV <span class="badge" id="b-painel">–</span></button>
  </div>
  <div class="right">
    <div class="seg" role="group" aria-label="Modo de exibição">
      <button type="button" id="m-uma" aria-pressed="true">Uma por vez</button>
      <button type="button" id="m-lado" aria-pressed="false">Lado a lado</button>
    </div>
    <button type="button" class="btn call" id="btn-som">🔈 Ativar som e voz</button>
    <button type="button" class="btn" id="btn-teste">Testar voz</button>
    <a class="lnk" href="vitrine.html">Simulação</a>
  </div>
</div>

<div class="stage" id="stage">
  <iframe id="f-triagem" data-src="triagem.html?embed" title="Triagem"></iframe>
  <iframe id="f-fila" data-src="fila-hospitalar.html?embed" title="Fila e chamada"></iframe>
  <iframe id="f-painel" data-src="painel.html?embed" title="Painel da TV"></iframe>
</div>

<script src="sistema.js"></script>
<script>
/* As três telas ficam carregadas o tempo todo, cada uma num quadro desta aba.
   Elas conversam pelo mesmo estado (sistema.js); a central só escolhe qual
   mostrar e é ela quem toca o aviso e a voz quando alguém é chamado. */
const S = Sistema;
const $ = id => document.getElementById(id);
const TELAS = ["triagem", "fila", "painel"];
const ARQ = { "triagem.html": "triagem", "fila-hospitalar.html": "fila", "painel.html": "painel" };
let atual = "triagem", lado = false;

function mostrar(tela, semHash) {
  if (!TELAS.includes(tela)) tela = "triagem";
  atual = tela;
  TELAS.forEach(t => {
    $("f-" + t).classList.toggle("show", t === tela);
    $("t-" + t).setAttribute("aria-selected", t === tela && !lado ? "true" : "false");
  });
  $("t-" + tela).classList.remove("ping");
  if (!semHash) history.replaceState(null, "", "#" + (lado ? "lado-a-lado" : tela));
}
function modo(ladoALado) {
  lado = ladoALado;
  document.body.classList.toggle("lado", lado);
  $("m-uma").setAttribute("aria-pressed", lado ? "false" : "true");
  $("m-lado").setAttribute("aria-pressed", lado ? "true" : "false");
  mostrar(atual);
}

/* Contadores nas abas e aviso quando algo muda numa tela que não está à vista */
let ultSenha = null, ultMarca = null;
function atualizar() {
  const e = S.estado();
  $("b-triagem").textContent = e.registros.length;
  $("b-fila").textContent = e.fila.total();
  $("b-painel").textContent = e.ultimo ? "#" + e.ultimo.senha : "–";

  const novaSenha = e.senha - 1;
  if (ultSenha !== null && novaSenha > ultSenha && atual !== "fila" && !lado) $("t-fila").classList.add("ping");
  ultSenha = novaSenha;

  const u = e.ultimo;
  const m = u ? u.senha + ":" + (u.rechamada || u.chamada) : "";
  if (ultMarca !== null && u && m !== ultMarca) {
    S.audio.anunciar(u);                       // aviso + voz feminina
    if (atual !== "painel" && !lado) $("t-painel").classList.add("ping");
  }
  ultMarca = m;
}

function som(on) {
  S.audio.ligar(on);
  const b = $("btn-som");
  b.classList.remove("call");
  b.classList.toggle("on", on);
  b.textContent = on ? "🔊 Som e voz ligados" : "🔈 Som desligado";
}

TELAS.forEach(t => $("t-" + t).addEventListener("click", () => mostrar(t)));
$("m-uma").addEventListener("click", () => modo(false));
$("m-lado").addEventListener("click", () => modo(true));
$("btn-som").addEventListener("click", () => som(!S.audio.ligado()));
$("btn-teste").addEventListener("click", () => { if (!S.audio.ligado()) som(true); S.audio.testar(); });

// Links dentro das telas (ex.: "Abrir a fila de atendimento") trocam a aba aqui
window.addEventListener("message", ev => {
  if (ev.data && ev.data.abrir && ARQ[ev.data.abrir]) { if (lado) modo(false); mostrar(ARQ[ev.data.abrir]); }
});
// Atalhos: Alt+1, Alt+2, Alt+3
document.addEventListener("keydown", ev => {
  if (ev.altKey && ["1", "2", "3"].includes(ev.key)) { ev.preventDefault(); if (lado) modo(false); mostrar(TELAS[+ev.key - 1]); }
});

// Carrega o exemplo uma vez só (antes de abrir as telas) e depois abre os quadros
if (S.estado().senha === 1) S.carregarExemplo();
document.querySelectorAll("iframe[data-src]").forEach(f => f.src = f.dataset.src);

function lerHash() {
  const h = location.hash.slice(1);
  if (h === "lado-a-lado") modo(true); else { if (lado) modo(false); mostrar(TELAS.includes(h) ? h : "triagem", true); }
}
window.addEventListener("hashchange", lerHash);
lerHash();
S.aoMudar(atualizar);
atualizar();
</script>
</body>
</html>
